<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Weed Hustle - Botanical art review</title><style>body{margin:0;background:#0b1711;color:#ecedda;font:16px system-ui}main{max-width:1100px;margin:40px auto;padding:24px}h1{font:44px Georgia;margin:10px 0}p{color:#bac6b5}header{max-width:660px}#stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-top:30px}figure{margin:0;border:1px solid #47654b55;background:radial-gradient(ellipse at 50% 50%,#304e37,#142b20 60%,#09170f);border-radius:16px;padding:10px}canvas{width:100%;height:auto}figcaption{padding:10px;font-size:13px}a{color:#d7dba0}</style><main><header><small>WEED HUSTLE / ART STUDY</small><h1>A plant you want to grow.</h1><p>Botanical textures, layered fan leaves and green resinous flowers. Thirteen growth milestones with the same saved gameplay state.</p><a href="/">Return to the farm</a></header><div id="stages"></div></main><script type="module">import {loadBotanicalAtlas,drawBotanicalPlant} from '/src/lib/botanicalPlant.ts';import {GROWTH_MILESTONES} from '/src/lib/plantGrowth.ts';await loadBotanicalAtlas();for(const stage of GROWTH_MILESTONES){const f=document.createElement('figure');const c=document.createElement('canvas');c.width=480;c.height=510;const ctx=c.getContext('2d');ctx.scale(3,3);drawBotanicalPlant(ctx,80,155,1,{progress:stage.at,seed:42,water:100});const caption=document.createElement('figcaption');caption.textContent=stage.name;f.append(c,caption);document.querySelector('#stages').append(f);}</script></html>
